server:
  port: 8081

fastapi:
  base-url: "http://localhost:8000"
  recommend-path: "/recommend/image"
  connect-timeout-ms: 5000
  read-timeout-ms: 60000

spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB

  datasource:
    url: jdbc:h2:mem:outfit;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console
